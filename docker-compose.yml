services:
  api:
    build: .
    container_name: fraud-agent-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
    environment:
      - DATABASE_URL=sqlite:///data/fraud_agent.db
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000

  dashboard:
    build: .
    container_name: fraud-agent-dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
    environment:
      - API_URL=http://api:8000
      - DATABASE_URL=sqlite:///data/fraud_agent.db
    depends_on:
      - api
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0
